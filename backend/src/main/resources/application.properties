quarkus.application.name=stockinteligence-backend

quarkus.log.level=INFO
quarkus.log.category."com.stockinteligence".level=DEBUG

# Datasource: em dev/test o Quarkus Dev Services sobe um PostgreSQL
# automaticamente (via Docker) quando nenhuma URL é configurada abaixo.
# Em produção, configurar via variáveis de ambiente:
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.datasource.jdbc.url=${DB_URL}

# Schema é gerido exclusivamente pelo Flyway (memory/constitution.md).
quarkus.hibernate-orm.database.generation=none
quarkus.flyway.migrate-at-start=true

# CORS — o frontend (specs/002-frontend-cadastro-produto) roda numa origem
# diferente (Vite dev server) e consome esta API via navegador.
# Nota: "quarkus.http.cors" foi renomeado para "quarkus.http.cors.enabled"
# a partir de determinada versão do Quarkus (a antiga é ignorada em silêncio
# em versões que já removeram o alias — usar sempre a nova).
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:5173
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Accept

# Mensageria: publica EstoqueBaixoAtingido no tópico estoque.baixo-atingido
# (specs/002-alerta-estoque-baixo). Em dev/test o Quarkus Dev Services sobe
# um broker (Redpanda) automaticamente quando nenhum bootstrap.servers é
# configurado — mesmo padrão zero-config do datasource acima.
mp.messaging.outgoing.estoque-baixo-atingido.connector=smallrye-kafka
mp.messaging.outgoing.estoque-baixo-atingido.topic=estoque.baixo-atingido
mp.messaging.outgoing.estoque-baixo-atingido.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer

# Em produção, configurar via variável de ambiente (mesmo padrão do datasource):
%prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS}

# Testes: troca o conector real por in-memory, evitando depender de um
# broker real para testar a semântica de TransactionPhase.AFTER_SUCCESS.
%test.mp.messaging.outgoing.estoque-baixo-atingido.connector=smallrye-in-memory
