# React Router faz roteamento no navegador (client-side) — sem isso, dar
# refresh ou acessar direto uma rota tipo /produtos/novo devolveria 404 do
# nginx, porque esse caminho não existe como arquivo físico em dist/. O
# try_files faz o nginx cair pro index.html sempre que o arquivo pedido não
# existir, deixando o React Router assumir o roteamento a partir daí.
try_files $uri $uri/ /index.html;
