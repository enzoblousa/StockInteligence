# Secret = "cofre" de dados sensíveis do Kubernetes/OpenShift (senhas, tokens
# de acesso). Diferente de um ConfigMap, o conteúdo de um Secret não aparece
# em texto puro nos logs/descrições do `oc describe` — só na versão base64
# (que NÃO é criptografia, é só codificação; a proteção de verdade vem de
# controle de acesso via RBAC, não do base64).
#
# ESTE ARQUIVO É SÓ DOCUMENTAÇÃO DO FORMATO ESPERADO — nunca é aplicado como
# está. O Secret real é criado direto por linha de comando
# (`oc create secret generic ...`), com senha gerada na hora, pra nunca
# deixar um segredo de verdade commitado no Git (ver
# infra/openshift/README.md, seção "Criar o Secret do Postgres").
apiVersion: v1
kind: Secret
metadata:
  name: postgresql-credentials
  namespace: enzoblousa-dev
type: Opaque
stringData:
  # Nomes de chave EXATOS exigidos pela imagem quay.io/sclorg/postgresql-16-c9s
  # (confirmados no README oficial do projeto sclorg/postgresql-container).
  POSTGRESQL_USER: "SUBSTITUA_ANTES_DE_APLICAR"
  POSTGRESQL_PASSWORD: "SUBSTITUA_POR_SENHA_FORTE_GERADA"
  POSTGRESQL_DATABASE: "stockinteligence"
  POSTGRESQL_ADMIN_PASSWORD: "SUBSTITUA_POR_OUTRA_SENHA_FORTE_GERADA"
