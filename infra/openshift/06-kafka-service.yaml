apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: enzoblousa-dev
spec:
  selector:
    app: kafka
  ports:
    - name: plaintext
      port: 9092
      targetPort: 9092
  # Porta 9093 (controller) não é exposta aqui de propósito: é tráfego
  # interno ao próprio pod (fala com "localhost"), não precisa de rota
  # de rede via Service.
