# Kafka rodando como um Deployment simples (sem operador Strimzi/AMQ
# Streams — o Developer Sandbox não permite instalar operadores novos,
# o usuário não é cluster-admin). Modo KRaft "combinado": o mesmo
# processo acumula os dois papéis (broker + controller), sem precisar de
# Zookeeper nem de múltiplos nós — é o modo mais simples pra uma demo de
# nó único. Mesma imagem já usada localmente pelo Quarkus Dev Services.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: enzoblousa-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: docker.io/apache/kafka-native:4.2.0
          ports:
            - containerPort: 9092   # porta de cliente — produtores/consumidores (o backend) conectam aqui
            - containerPort: 9093   # porta de controller — uso interno do próprio processo, não é exposta no Service
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"
            # Nome do Service (ver 06-kafka-service.yaml) — é o endereço
            # que o backend, rodando em outro pod, vai usar pra conectar.
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka:9092"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            # O nó fala consigo mesmo (mesmo pod) na porta de controller —
            # por isso "localhost" aqui, e não o nome do Service.
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@localhost:9093"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 30
            periodSeconds: 20
      # Sem "volumes"/PVC de propósito: perder o estado do Kafka entre
      # reinícios de pod é uma limitação aceita nesta demo — o tópico
      # "estoque.baixo-atingido" é recriado sozinho no primeiro publish,
      # do mesmo jeito que já validamos rodando localmente.
