quarkus.application.name=stockinteligence-notification-service

quarkus.log.level=INFO
quarkus.log.category."com.stockinteligence".level=DEBUG

# Consome o topico publicado pelo backend (feature 002 -
# specs/002-alerta-estoque-baixo). Em dev/test o Quarkus Dev Services sobe
# um broker (Redpanda/Kafka) automaticamente quando nenhum bootstrap.servers
# e configurado - mesmo padrao zero-config ja usado no backend. Se o backend
# tambem estiver rodando via quarkus:dev na mesma maquina, os dois devem
# reusar o MESMO broker (Dev Services compartilha por padrao entre modulos
# Maven independentes via label Docker - ver plan.md da sessao que criou
# este servico para os detalhes).
mp.messaging.incoming.estoque-baixo-atingido.connector=smallrye-kafka
mp.messaging.incoming.estoque-baixo-atingido.topic=estoque.baixo-atingido
# group.id fixo (nao gerado): mantem o offset commitado entre reinicios do
# POD deste servico, evitando reprocessar/duplicar alertas a cada restart.
mp.messaging.incoming.estoque-baixo-atingido.group.id=notification-service
# So entra em jogo quando nao ha offset commitado ainda para este group.id
# (primeira subida) - garante que alertas publicados antes deste consumidor
# existir tambem sejam processados.
mp.messaging.incoming.estoque-baixo-atingido.auto.offset.reset=earliest
mp.messaging.incoming.estoque-baixo-atingido.value.deserializer=com.stockinteligence.notification.messaging.EstoqueBaixoAtingidoDeserializer

# Em producao, configurar via variavel de ambiente (mesmo padrao do backend):
%prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS}

# Testes: troca o conector real por in-memory, permitindo injetar mensagens
# diretamente no canal sem depender de um broker real.
%test.mp.messaging.incoming.estoque-baixo-atingido.connector=smallrye-in-memory
%test.quarkus.kafka.devservices.enabled=false

# Evita colisao com a porta 8080 do backend ao rodar os dois em quarkus:dev
# na mesma maquina ao mesmo tempo. So afeta dev - em producao cada um roda
# no seu proprio container/pod, sem colisao possivel.
%dev.quarkus.http.port=8081

# CORS - o frontend consome este servico direto do navegador (mesmo padrao
# do backend, ver backend/src/main/resources/application.properties).
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:5173,https://frontend-enzoblousa-dev.apps.rm2.thpm.p1.openshiftapps.com
quarkus.http.cors.methods=GET,OPTIONS
quarkus.http.cors.headers=Content-Type,Accept
